<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f6f8f5"/><rect width="14" height="630" fill="#2d6a3e"/><g font-family="Arial, Helvetica, sans-serif"><text x="70" y="78" fill="#2d6a3e" font-size="23" font-weight="700">BEYOND AI / DECISION MODELS, PART 2</text><text x="70" y="178" fill="#19251e" font-size="62" font-weight="700">Harder tests, more models.</text><text x="70" y="252" fill="#54645a" font-size="30">When keyword rules score 99%, the test measures the rules.</text><text x="70" y="300" fill="#54645a" font-size="30">So we wrote spam with no keywords.</text><text x="70" y="388" fill="#2d6a3e" font-size="20" font-weight="700">SPAM WITHOUT KEYWORDS · 30 SPAM, 120 GENUINE · PROBABILITY ≥ 0.5</text><text x="70" y="432" fill="#19251e" font-size="22">Keyword rules</text><rect x="330" y="415" width="420" height="22" rx="4" fill="#e3ebe5"/><rect x="330" y="415" width="0.0" height="22" rx="4" fill="#2d6a3e"/><text x="770" y="433" fill="#19251e" font-size="21" font-weight="700">0 of 30 caught · 27 genuine flagged</text><text x="70" y="474" fill="#19251e" font-size="22">Microsoft-Decision-1</text><rect x="330" y="457" width="420" height="22" rx="4" fill="#e3ebe5"/><rect x="330" y="457" width="182.0" height="22" rx="4" fill="#2d6a3e"/><text x="770" y="475" fill="#19251e" font-size="21" font-weight="700">13 of 30 caught · 0 genuine flagged</text><text x="70" y="516" fill="#19251e" font-size="22">Clef-flash</text><rect x="330" y="499" width="420" height="22" rx="4" fill="#e3ebe5"/><rect x="330" y="499" width="154.0" height="22" rx="4" fill="#2d6a3e"/><text x="770" y="517" fill="#19251e" font-size="21" font-weight="700">11 of 30 caught · 2 genuine flagged</text><text x="70" y="558" fill="#19251e" font-size="22">Kev 1.0</text><rect x="330" y="541" width="420" height="22" rx="4" fill="#e3ebe5"/><rect x="330" y="541" width="70.0" height="22" rx="4" fill="#2d6a3e"/><text x="770" y="559" fill="#19251e"